<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medusa — RAG Dashboard</title>
<style>
:root{--bg:#f3f2ef;--paper:#fffefa;--ink:#1a1a17;--muted:#77756e;--line:#dedbd2;--charcoal:#191a17;--gold:#bd9654;--green:#3f8d6c;--red:#b95f57}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 Arial,sans-serif}.shell{min-height:100vh;display:flex}.side{width:250px;background:var(--charcoal);color:#f5f2e9;padding:26px 20px;display:flex;flex-direction:column}.logo{width:185px;display:block}.caption{margin-top:10px;color:#aaa79d;font:10px monospace;letter-spacing:2px}.spacer{flex:1}.status{border:1px solid #363731;border-radius:10px;padding:13px;color:#aaa79d;font-size:11px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c86b63;margin-right:7px}.dot.ok{background:#67aa87}.side button{margin-top:10px;border:0;background:none;color:#c8a56b;padding:0;text-align:left;cursor:pointer}main{flex:1;min-width:0}.top{padding:25px 34px;border-bottom:1px solid var(--line);background:#fffefa}.eyebrow{font:10px monospace;letter-spacing:1.7px;color:#94713b}.top h1{font:600 32px Georgia,serif;margin:8px 0}.hero{margin:22px 34px;padding:25px 28px;border-radius:15px;color:#f7f4ec;background:linear-gradient(120deg,#20211e,#2a2b26)}.hero p{max-width:680px;color:#d0cec4}.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;padding:0 34px 24px}.card{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:18px;margin-top:22px}label{display:block;color:var(--muted);font:10px monospace;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:9px;padding:12px;background:#fffefa;outline:none}textarea{min-height:130px;resize:vertical}.action{margin-top:12px;border:1px solid #9b773e;border-radius:8px;background:var(--charcoal);color:#fff;padding:10px 17px;cursor:pointer}.result{margin-top:16px;padding:14px;border:1px solid var(--line);border-radius:10px;white-space:pre-wrap}.metrics{border-left:1px solid var(--line);padding-left:20px;margin-top:22px}.metric{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ebe8e0;font-size:12px}.metric b{font-family:monospace}.tabs{display:flex;gap:6px;margin-top:14px}.tabs button{border:1px solid var(--line);background:#fffefa;border-radius:8px;padding:8px 13px;cursor:pointer}.tabs button.active{background:var(--charcoal);color:#fff}.hidden{display:none}.error{color:var(--red);margin-top:10px}.ok{color:var(--green);margin-top:10px}@media(max-width:900px){.shell{display:block}.side{width:auto}.grid{grid-template-columns:1fr;padding:0 18px 20px}.hero{margin:18px}.top{padding:20px 18px}.metrics{border-left:0;border-top:1px solid var(--line);padding:18px 0 0}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><img class="logo" src="./medusa-logo.jpg" alt="Medusa"><div class="caption">RAG ENGINE</div><div class="spacer"></div><div class="status"><span id="dot" class="dot"></span><span id="health">Checking API…</span></div><button onclick="checkHealth()">Refresh connection</button></aside>
<main><header class="top"><div class="eyebrow">MEDUSA / LOCAL RAG SYSTEM</div><h1>Knowledge, unlocked.</h1><div class="tabs"><button id="queryTab" class="active" onclick="showTab('query')">Ask Medusa</button><button id="ingestTab" onclick="showTab('ingest')">Knowledge Base</button></div></header>
<section class="hero"><div class="eyebrow">01 — QUERY</div><p>Retrieve context from your ingested documents through the real Medusa backend.</p></section>
<div class="grid"><section>
<div id="queryCard" class="card"><label>Question</label><textarea id="question" placeholder="What does the document say about…"></textarea><label style="margin-top:12px">Prompt version</label><select id="prompt"><option>v1</option><option>v2</option></select><label style="margin-top:12px"><input id="cache" type="checkbox" checked style="width:auto;margin-right:7px">Use cache</label><button class="action" onclick="queryMedusa()">Send query</button><div id="queryError" class="error"></div><div id="answer" class="result hidden"></div></div>
<div id="ingestCard" class="card hidden"><label>Upload document</label><input id="file" type="file" accept=".pdf,.txt,.md"><button class="action" onclick="ingestFile()">Ingest file</button><div id="ingestError" class="error"></div><div id="ingestResult" class="ok"></div><hr style="border:0;border-top:1px solid #dedbd2;margin:20px 0"><label>Or paste text</label><input id="source" placeholder="Source name (optional)"><textarea id="text" placeholder="Paste document text here…" style="margin-top:8px"></textarea><button class="action" onclick="ingestText()">Ingest text</button></div>
</section><aside class="metrics"><label>Live metrics</label><div class="metric"><span>Requests</span><b id="requests">—</b></div><div class="metric"><span>Errors</span><b id="errors">—</b></div><div class="metric"><span>Cache hits</span><b id="hits">—</b></div><div class="metric"><span>Cache misses</span><b id="misses">—</b></div><div class="metric"><span>Fallback L1</span><b id="fb1">—</b></div><div class="metric"><span>Fallback L2</span><b id="fb2">—</b></div><div class="metric"><span>Documents</span><b id="docs">—</b></div><div class="metric"><span>Prompt tokens</span><b id="pt">—</b></div><div class="metric"><span>Completion tokens</span><b id="ct">—</b></div></aside></div></main></div>
<script>
const BASE=location.protocol==="file:"?"http://localhost:8000":"";
async function api(path,options){const r=await fetch(BASE+path,options);const type=r.headers.get("content-type")||"";const d=type.includes("application/json")?await r.json():await r.text();if(!r.ok)throw new Error(d&&d.detail||`Request failed (${r.status})`);return d}
async function checkHealth(){try{await api("/health");health.textContent="API Online";dot.className="dot ok"}catch(e){health.textContent="API Offline";dot.className="dot"}}
async function queryMedusa(){queryError.textContent="";answer.classList.add("hidden");const q=question.value.trim();if(q.length<3){queryError.textContent="Query must be at least 3 characters.";return}try{const d=await api("/api/v1/query",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:q,prompt_version:prompt.value,use_cache:cache.checked})});answer.textContent=d.answer+"\n\nTrace: "+(d.trace_id||"—")+"\nChunks: "+(d.retrieved_chunks??"—")+" | Cached: "+(d.cached?"yes":"no")+" | Fallback: "+(d.fallback_level||"none");answer.classList.remove("hidden");refreshMetrics()}catch(e){queryError.textContent=e.message}}
async function ingestFile(){ingestError.textContent="";ingestResult.textContent="";const f=file.files[0];if(!f){ingestError.textContent="Select a PDF, TXT, or MD file.";return}try{const fd=new FormData();fd.append("file",f);const d=await api("/api/v1/documents/upload",{method:"POST",body:fd});ingestResult.textContent="Document ingested: "+(d.filename||f.name)+" — "+(d.chunk_count??"")+" chunks";refreshMetrics()}catch(e){ingestError.textContent=e.message}}
async function ingestText(){ingestError.textContent="";ingestResult.textContent="";const t=text.value.trim();if(t.length<10){ingestError.textContent="Text too short.";return}try{const d=await api("/api/v1/documents/text",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:t,source_name:source.value||"inline_text"})});ingestResult.textContent="Text ingested — "+(d.chunk_count??"")+" chunks";refreshMetrics()}catch(e){ingestError.textContent=e.message}}
async function refreshMetrics(){try{const raw=await api("/metrics");const val=re=>{const m=raw.match(re);return m?Math.round(parseFloat(m[1])):0};requests.textContent=val(/^medusa_http_requests_total\{[^}]+\}\s+([\d.e+]+)/m);errors.textContent=val(/^medusa_http_requests_total\{[^}]*status_code="5\d\d"[^}]*\}\s+([\d.e+]+)/m);hits.textContent=val(/medusa_cache_hits_total\{result="hit"\}\s+([\d.e+]+)/m);misses.textContent=val(/medusa_cache_hits_total\{result="miss"\}\s+([\d.e+]+)/m);fb1.textContent=val(/medusa_fallback_triggered_total\{fallback_level="level1"\}\s+([\d.e+]+)/m);fb2.textContent=val(/medusa_fallback_triggered_total\{fallback_level="level2"\}\s+([\d.e+]+)/m);docs.textContent=val(/medusa_documents_ingested_total\{status="success"\}\s+([\d.e+]+)/m);pt.textContent=val(/medusa_llm_tokens_total\{[^}]*token_type="prompt"[^}]*\}\s+([\d.e+]+)/m);ct.textContent=val(/medusa_llm_tokens_total\{[^}]*token_type="completion"[^}]*\}\s+([\d.e+]+)/m)}catch(e){}}
function showTab(t){queryCard.classList.toggle("hidden",t!=="query");ingestCard.classList.toggle("hidden",t!=="ingest");queryTab.classList.toggle("active",t==="query");ingestTab.classList.toggle("active",t==="ingest")}
checkHealth();refreshMetrics();setInterval(refreshMetrics,10000);setInterval(checkHealth,15000);
</script>
</body></html>
